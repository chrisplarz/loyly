name: Backup and restore checks
on:
  pull_request:
  push:
    branches:
      - feature/loy-01-safe-backup-restore
permissions:
  contents: read
jobs:
  backup-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/release.mjs check --online
      - run: node --test tests/release.test.cjs tests/backup.test.cjs tests/chatgpt-share.test.cjs tests/visits-page.test.cjs tests/intentions.test.cjs tests/planning.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/backup.browser.test.cjs
      - run: node tests/appearance.browser.test.cjs
      - run: node tests/reflection.browser.test.cjs
      - run: node tests/cycles.browser.test.cjs
      - run: node tests/weather.browser.test.cjs
      - run: node tests/home-refinements.browser.test.cjs
      - run: node tests/intentions.browser.test.cjs
      - run: node tests/design-parity.browser.test.cjs
      - run: node tests/planning.browser.test.cjs
      - run: node tests/visit-checkin.browser.test.cjs
