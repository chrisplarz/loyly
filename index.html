/* Tactile decoration stays behind the existing app surfaces. */
body::before,body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0}
body::before{background:url('./assets/paper.svg') repeat;opacity:.38}
body::after{background:url('./assets/botanical.svg') no-repeat right -130px bottom -180px;background-size:650px 1000px;opacity:.12;-webkit-mask-image:linear-gradient(to right,transparent 12%,#000 72%);mask-image:linear-gradient(to right,transparent 12%,#000 72%)}
.app{position:relative;z-index:1}
.hero{background-image:radial-gradient(ellipse at 90% 90%,var(--pine2) 0%,transparent 65%)}
.hero::after{inset:0;width:auto;height:auto;background:url('./assets/paper.svg'),radial-gradient(ellipse at 80% 100%,#6b8d75,transparent 70%);opacity:.12}
.welcome-preference{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px;font-size:13px}
.welcome-preference input{width:22px;height:22px;accent-color:var(--pine);flex-shrink:0}
.welcome-intro{position:fixed;inset:0;z-index:70;overflow:hidden;background:var(--sand) url('./assets/paper.svg');pointer-events:none;animation:welcome-dissolve 5s linear both}
.welcome-scene{position:absolute;inset:30% 0 0;width:100%;height:70%;object-fit:cover;animation:welcome-push 5s ease-out both}
.welcome-shade{position:absolute;inset:0;background:linear-gradient(var(--sand) 0%,var(--sand) 30%,rgba(246,244,237,.75) 38%,transparent 58%)}
.welcome-wordmark{position:absolute;left:20px;right:20px;top:20%;text-align:center;color:var(--pine);animation:welcome-wordmark 5s linear both}
.welcome-wordmark strong{font:500 clamp(36px,7vw,64px) Manrope,sans-serif;letter-spacing:.28em;padding-left:.28em}
.welcome-wordmark p{font-size:10px;letter-spacing:.3em;margin:18px 0}
.welcome-skip{position:absolute;top:max(20px,env(safe-area-inset-top));right:20px;pointer-events:auto;background:var(--paper);color:var(--pine);border:1px solid var(--line);border-radius:999px;padding:12px 20px;min-height:44px;font-weight:700;font-size:13px}
.welcome-skip:focus-visible{outline:3px solid var(--pine);outline-offset:3px}
@keyframes welcome-dissolve{0%,85%{opacity:1}100%{opacity:0}}
@keyframes welcome-push{from{transform:scale(1)}to{transform:scale(1.025)}}
@keyframes welcome-wordmark{0%,35%{opacity:0}58%,100%{opacity:1}}
@media(max-width:680px){body::after{background-position:right -320px bottom -100px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.page,.toast,.welcome-intro,.welcome-scene,.welcome-wordmark{animation:none}.btn,.progress-fill,.bar-fill{transition:none}.btn:hover{transform:none}.welcome-intro{display:none}}
.daily-reflection{background:var(--paper);padding:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;color:var(--ink)}
.reflection-header{width:100%;min-height:88px;padding:22px;display:flex;align-items:flex-start;gap:14px;text-align:left;border:0;background:transparent;color:inherit}
.reflection-header:focus-visible{outline:2px solid var(--pine);outline-offset:-5px;border-radius:var(--radius)}
.reflection-leaf{color:var(--pine);padding-top:2px;flex-shrink:0}.reflection-heading{display:grid;gap:9px;flex:1;min-width:0}.reflection-label{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--pine2)}.reflection-title{font:italic 400 clamp(20px,2vw,23px)/1.6 Georgia,'Times New Roman',serif;letter-spacing:-.025em}.reflection-heading time{font-size:11px;color:#53665b}.reflection-chevron{flex-shrink:0;transition:transform 250ms ease;transform:rotate(90deg)}[aria-expanded="true"] .reflection-chevron{transform:rotate(-90deg)}
.reflection-body{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows 250ms ease,visibility 250ms}.reflection-body.expanded{grid-template-rows:1fr;visibility:visible}.reflection-body>div{overflow:hidden;min-height:0}.reflection-body p{font-size:14px;line-height:1.85;margin:0;padding:0 22px 24px 56px;max-width:710px}
@media(max-width:680px){.reflection-header{padding:20px 17px;gap:10px}.reflection-body p{padding:0 17px 22px}.daily-reflection{border-radius:17px}}
@media(prefers-reduced-motion:reduce){.reflection-body,.reflection-chevron{transition:none}}

/* Match the existing uppercase reflection label across the Home statistics. */
#page-home .stats .stat-label{text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--pine2)}
.reflection-hint{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}.reflection-hint::before{content:'';width:18px;height:1px;background:var(--moss)}

.welcome-intro.loading{animation:none;opacity:1}.welcome-intro.loading .welcome-wordmark{animation:none;opacity:1}

.metric-card .stat-label{text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--pine2)}
.modal .metric-card .stat-number{font-size:clamp(22px,3vw,32px)}.modal .metric-card .stat-unit{display:inline-block}

.tab{display:inline-flex;align-items:center;justify-content:center;gap:7px}.tab svg{width:16px;height:16px;flex-shrink:0}
.welcome-preference{justify-content:flex-start;gap:12px}.welcome-preference input{margin:0}

const DAILY_REFLECTIONS = [
 {
  "id": "reflection-01",
  "headline": "Possibility begins with what you already know",
  "body": "Your experience holds patterns that someone else has yet to discover. A conversation, an old skill, or a lesson learned the difficult way can become the beginning of something useful. AI can help you explore its shape without requiring you to know the destination. As you settle into the warmth, consider which part of your experience you would enjoy sharing in a new form."
 },
 {
  "id": "reflection-02",
  "headline": "Let curiosity choose the next small opening",
  "body": "You do not need a complete plan to become interested in something. Curiosity can begin with a question you keep returning to, even when there is no obvious practical use. With AI as a patient collaborator, you can follow that question a little further. Today, let exploration be enough. Notice what draws your attention when there is no deadline attached to it."
 },
 {
  "id": "reflection-03",
  "headline": "Give an unfinished idea room to breathe",
  "body": "An idea does not need to arrive fully formed to deserve your attention. A few words, a rough drawing, or an unexpected connection can be enough to begin a conversation with AI. You can try different directions without committing to any of them. Here in the quiet, what thought might become more interesting if you allowed it to remain unfinished for a while?"
 },
 {
  "id": "reflection-04",
  "headline": "Your judgment gives new tools their direction",
  "body": "AI can offer variations, explanations, and surprising connections. Your judgment decides what feels useful, honest, and worth making. That judgment has been shaped by years of paying attention to people and situations. There is no need to set it aside when learning something new. Consider where your particular way of seeing could make a familiar tool serve a more thoughtful purpose."
 },
 {
  "id": "reflection-05",
  "headline": "Financial freedom starts with a personal definition",
  "body": "Freedom may mean a quieter morning, time with someone you love, or the ability to choose work that matters to you. Before thinking about how to earn more, consider what enough would allow you to experience. Your knowledge and creative tools can open possibilities, but they need a direction that belongs to you. What would you want an ordinary Tuesday to feel like?"
 },
 {
  "id": "reflection-06",
  "headline": "Make something that carries your particular perspective",
  "body": "There are many ways to explain a subject, tell a story, or solve a small problem. Yours can reflect the details you notice and the people you understand. AI can help with structure and experimentation while you supply the perspective. You do not have to appeal to everyone. Think of one person whose day might feel easier because of something you could create."
 },
 {
  "id": "reflection-07",
  "headline": "Rest can change the question you ask",
  "body": "Some questions become clearer after you stop trying to answer them. Warmth, stillness, and a little distance can reveal an assumption that effort kept in place. You can return to your tools later with a different starting point. For now, allow the problem to loosen its grip. Is there a gentler or more interesting question underneath the one you have been carrying?"
 },
 {
  "id": "reflection-08",
  "headline": "Confidence can grow through a private experiment",
  "body": "You can explore a possibility before announcing it, naming it, or deciding what it means about you. A private experiment leaves room for uncertainty. Ask AI to help sketch a version, compare approaches, or explain a missing piece. Then notice what you learn about your own preferences. Confidence can come from familiarity with the process, rather than certainty about where it will lead."
 },
 {
  "id": "reflection-09",
  "headline": "The present is part of what you seek",
  "body": "It is easy to imagine freedom as a place you will reach after the next project succeeds. Yet the warmth on your skin and the space to breathe are already meaningful experiences. Creating a different future need not make today feel like a waiting room. What small part of the life you imagine is available to appreciate in this very ordinary moment?"
 },
 {
  "id": "reflection-10",
  "headline": "Old skills can find unexpected new company",
  "body": "A skill learned years ago may become useful in a setting you never anticipated. Pair it with a new interest, a different audience, or an AI tool that removes a technical obstacle. The result need not be a business or a major undertaking. It might simply make learning enjoyable again. Which familiar ability would you like to meet with fresh curiosity today?"
 },
 {
  "id": "reflection-11",
  "headline": "Begin with the people you understand well",
  "body": "Useful ideas often begin with noticing where people hesitate, repeat work, or feel overlooked. Your experience may give you a close view of those moments. AI can help you explore possible responses, but listening gives those responses meaning. During this pause, think about a group you know well. What would you enjoy making easier for them, without assuming you already know the answer?"
 },
 {
  "id": "reflection-12",
  "headline": "Imagination deserves time without an immediate purpose",
  "body": "Not every imagined possibility needs to become a commitment. You can picture a different way to work, learn, or spend a season simply because it widens your sense of choice. AI can help make those possibilities more concrete when you want to explore them. Today, let imagination be spacious. What would you be curious about if it did not have to justify itself?"
 },
 {
  "id": "reflection-13",
  "headline": "A thoughtful question can become a creative tool",
  "body": "The quality of a conversation often changes when the question becomes more specific. Instead of asking AI for a perfect idea, share what you care about, what you have tried, and what feels unresolved. Those details create room for a more useful exchange. You already know more about your situation than any tool does. Which detail would help a collaborator understand what matters most?"
 },
 {
  "id": "reflection-14",
  "headline": "Choose an opportunity that fits your life",
  "body": "An opportunity can be attractive without being right for your present season. Consider the energy, relationships, and experiences you want to protect alongside any possible financial return. AI can help you examine options, but your life supplies the criteria. There is confidence in choosing deliberately. What kind of opportunity would leave you with more room for the things you already value?"
 },
 {
  "id": "reflection-15",
  "headline": "You can learn without starting over completely",
  "body": "Learning a new tool does not erase the value of everything you learned before it existed. Your ability to notice nuance, ask questions, and understand consequences travels with you. AI may change how you approach a task while leaving those abilities essential. Allow yourself the patience of a beginner and the dignity of experience. Both can be present in the same conversation today."
 },
 {
  "id": "reflection-16",
  "headline": "Leave a little room for pleasant surprise",
  "body": "Plans help us move, but they can also narrow what we notice. A surprising answer from AI, an unfamiliar book, or a casual conversation may suggest a direction you would not have chosen in advance. You do not have to follow every opening. Simply leave room to recognize one. What has interested you recently that falls outside the story you usually tell about yourself?"
 },
 {
  "id": "reflection-17",
  "headline": "Your attention reveals what matters to you",
  "body": "Notice the subjects you return to when nobody is asking you to. They may hold clues about what you would enjoy learning, sharing, or creating. AI can help turn that interest into a small exploration, but there is no need to monetize every curiosity. Some interests enrich life by remaining personal. Which one would you like to give a little more room this week?"
 },
 {
  "id": "reflection-18",
  "headline": "A small useful thing can be enough",
  "body": "You do not need to reinvent an industry to make something worthwhile. A clear guide, a helpful template, or a simple explanation can make a real difference to a particular person. AI can help you draft and refine while you bring care and context. Consider a frustration you understand firsthand. What modest response would have helped you when you first encountered it?"
 },
 {
  "id": "reflection-19",
  "headline": "Let your values shape the possible future",
  "body": "New tools can make more choices available, but more choices do not automatically create a satisfying life. Your values help you decide which possibilities deserve attention. Perhaps you want independence, creative expression, time outdoors, or deeper connection. Those preferences are useful design constraints. As you rest here, which value would you like to see reflected more clearly in the next thing you make?"
 },
 {
  "id": "reflection-20",
  "headline": "There is room to revise your direction",
  "body": "Changing your mind can be a sign that you are paying attention. An experiment may reveal that you prefer teaching to selling, or collaborating to working alone. AI makes it easier to sketch another version before investing heavily in it. You are allowed to use what you learn. What would become lighter if you treated your current direction as a draft rather than a verdict?"
 },
 {
  "id": "reflection-21",
  "headline": "Meaningful experiences need space on the calendar",
  "body": "The experiences you hope to afford also need time and attention to be enjoyed. A creative project or new income idea can serve that larger intention when its shape is chosen carefully. AI may help remove friction, but it cannot decide what deserves your time. Picture an experience you would like to share with someone. What about it feels most valuable to you?"
 },
 {
  "id": "reflection-22",
  "headline": "Your questions may be useful to someone else",
  "body": "Something you are trying to understand may also be puzzling to others. Documenting your questions and what you discover can become a generous way to share knowledge. AI can help organize the material without replacing your honest account of learning. There is value in showing the uncertain middle. What subject would you enjoy exploring openly, with room to say that you are still figuring it out?"
 },
 {
  "id": "reflection-23",
  "headline": "Try seeing your knowledge through another doorway",
  "body": "A familiar subject can look different when you imagine explaining it to a child, a newcomer, or someone in another field. AI can help you practice those changes in perspective. The exercise may reveal a clearer explanation or an overlooked application. You do not need to act on it immediately. Which part of your knowledge might feel alive again when approached from a different angle?"
 },
 {
  "id": "reflection-24",
  "headline": "Build trust in your ability to explore",
  "body": "You cannot know every outcome before beginning, but you can become familiar with how you respond to uncertainty. You can ask for help, test a small version, and change course when evidence suggests it. AI offers another way to practice that process. Let confidence rest in your capacity to learn. Recall a time when you found your way without having the whole map."
 },
 {

const REFLECTION_KEY='loyly-daily-reflection-v1';
let reflectionMemory=null;
const reflectionProvider={
 getDaily(date=new Date()){
  const day=localDate(date),ids=DAILY_REFLECTIONS.map(r=>r.id);
  let state=reflectionMemory;
  try{const saved=JSON.parse(localStorage.getItem(REFLECTION_KEY));if(saved)state=saved}catch(e){}
  const valid=state&&typeof state.day==='string'&&ids.includes(state.id)&&Array.isArray(state.used)&&state.used.every(id=>ids.includes(id))&&state.used.includes(state.id)&&new Set(state.used).size===state.used.length;
  if(valid&&state.day===day){reflectionMemory=state;return {...DAILY_REFLECTIONS.find(r=>r.id===state.id),day}}
  let used=valid?state.used:[];
  if(used.length===ids.length)used=[];
  let available=ids.filter(id=>!used.includes(id));
  // Avoid a repeated neighbour when beginning a fresh cycle.
  if(!used.length&&valid&&available.length>1)available=available.filter(id=>id!==state.id);
  const id=available[Math.floor(Math.random()*available.length)];
  state={day,id,used:[...used,id]};reflectionMemory=state;
  try{localStorage.setItem(REFLECTION_KEY,JSON.stringify(state))}catch(e){} // Storage denial must never interrupt a session.
  return {...DAILY_REFLECTIONS.find(r=>r.id===id),day};
 }
};

// BEGIN BACKUP CORE
function normalizeAppearance(value){return {background:'botanical',dailyIntro:value?.dailyIntro!==false}}
function parseBackup(text){
 const d=JSON.parse(text),object=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
 const fail=()=>{throw Error('That file is not a compatible Ølo Notes backup.')};
 if(!object(d)||!object(d.profile)||!Array.isArray(d.visits)||d.visits.length>20000||(d.format!==undefined&&d.format!=='loyly-journal-v1'))fail();
 const ids=new Set();
 for(const v of d.visits){
  if(!object(v)||typeof v.id!=='string'||!v.id.trim()||['__proto__','constructor','prototype'].includes(v.id)||ids.has(v.id)||typeof v.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v.date)||!Number.isFinite(Date.parse(v.date))||new Date(v.date).toISOString().slice(0,10)!==v.date||!Array.isArray(v.intervals)||v.intervals.length>1000)fail();
  ids.add(v.id);
  for(const k of ['createdAt','updatedAt'])if(v[k]!==undefined&&(!Number.isFinite(v[k])||v[k]<0))fail();
  for(const k of ['notes','source'])if(v[k]!==undefined&&typeof v[k]!=='string')fail();
  for(const k of ['moodBefore','moodAfter'])if(v[k]!=null&&(!Number.isFinite(v[k])||v[k]<1||v[k]>5))fail();
  if(v.tags!==undefined&&(!Array.isArray(v.tags)||v.tags.some(x=>typeof x!=='string')))fail();
  for(const x of v.intervals){if(!object(x)||!['sauna','cold','rest'].includes(x.type)||!Number.isFinite(x.durationMs)||x.durationMs<0||(x.temp!=null&&!Number.isFinite(x.temp))||(x.activity!==undefined&&(!Array.isArray(x.activity)||x.activity.some(t=>typeof t!=='string')))||(x.id!==undefined&&typeof x.id!=='string'))fail()}
 }
 for(const k of ['name','gender','weight'])if(d.profile[k]!==undefined&&!['string','number'].includes(typeof d.profile[k]))fail();
 if(d.profile.goal!==undefined&&(!Number.isFinite(Number(d.profile.goal))||Number(d.profile.goal)<1||Number(d.profile.goal)>6))fail();
 return {profile:{name:String(d.profile.name||'').slice(0,80),gender:String(d.profile.gender||''),weight:String(d.profile.weight||''),goal:Number(d.profile.goal)||3,...(d.profile.appearance?{appearance:normalizeAppearance(d.profile.appearance)}:{})},visits:d.visits};
}
function backupFingerprint(value){
 if(Array.isArray(value))return '['+value.map(backupFingerprint).join(',')+']';
 if(value&&typeof value==='object')return '{'+Object.keys(value).filter(k=>k!=='updatedAt'&&value[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+backupFingerprint(value[k])).join(',')+'}';
 return JSON.stringify(value);
}
function planBackup(backup,current,deleted={}){
 const local=new Map(current.visits.map(v=>[v.id,v])),plan={newVisits:[],duplicates:[],conflicts:[],deleted:[]};
 for(const v of backup.visits){const old=local.get(v.id);if(old){(backupFingerprint(old)===backupFingerprint(v)?plan.duplicates:plan.conflicts).push(v)}else if(Object.hasOwn(deleted,v.id)){plan.deleted.push(v)}else plan.newVisits.push(v)}
 return plan;
}
function buildBackupRestore(backup,current,meta,mode,now=Date.now()){
 if(!['merge','replace'].includes(mode))throw Error('Unknown restore action');
 const next=structuredClone(mode==='merge'?{profile:current.profile,visits:[...current.visits,...planBackup(backup,current,meta.deleted).newVisits]}:backup);
 const nextMeta=structuredClone(meta),old=new Map(current.visits.map(v=>[v.id,v]));
 for(const v of next.visits){const prior=old.get(v.id);if(!prior||backupFingerprint(prior)!==backupFingerprint(v))v.updatedAt=Math.max(now,Number(nextMeta.deleted[v.id]||0)+1,Number(prior?.updatedAt||prior?.createdAt||0)+1)}
 if(mode==='replace'){
  const retained=new Set(next.visits.map(v=>v.id));
  for(const v of current.visits)if(!retained.has(v.id))nextMeta.deleted[v.id]=Math.max(now,Number(v.updatedAt||v.createdAt||0),Number(nextMeta.deleted[v.id]||0));
  if(JSON.stringify(next.profile)!==JSON.stringify(current.profile))nextMeta.profileUpdatedAt=Math.max(now,Number(meta.profileUpdatedAt||0)+1);
 }
 return {db:next,meta:nextMeta};
}
// END BACKUP CORE
let pendingBackup=null,backupPreviewState='';
const RECOVERYKEY='loyly-before-restore-v1';
function restoreState(){return JSON.stringify([db,cloudMeta])}
async function importJSON(e){
 const f=e.target.files?.[0];e.target.value='';if(!f)return;
 try{if(f.size>20*1024*1024)throw Error('Choose a backup smaller than 20 MB.');const backup=parseBackup(await f.text());pendingBackup=backup;showBackupPreview()}
 catch(err){toast(err instanceof SyntaxError?'That file is not valid JSON. No data changed.':err.message||'Could not read that backup. No data changed.')}
}
function showBackupPreview(){
 if(!pendingBackup)return;
 const plan=planBackup(pendingBackup,db,cloudMeta.deleted);backupPreviewState=restoreState();
 modal('Preview backup',`<p class="small muted">${pendingBackup.visits.length} visits in this backup. Nothing has changed yet.</p><div class="stats"><div class="card"><div class="stat-label">New visits</div><div class="stat-number">${plan.newVisits.length}</div></div><div class="card"><div class="stat-label">Duplicate visits</div><div class="stat-number">${plan.duplicates.length}</div></div><div class="card"><div class="stat-label">Conflicting visits</div><div class="stat-number">${plan.conflicts.length}</div></div></div><p class="small muted" style="line-height:1.8;margin-top:18px">Duplicates have the same ID and content. Conflicts share an ID with different content. ${plan.deleted.length} previously deleted visits will stay deleted during merge.</p><div class="notice"><strong>Safe merge · Recommended</strong><br>Adds only new visits. Keeps every existing visit, conflicting local version, and your current preferences.</div><p class="small muted" style="line-height:1.8;margin-top:18px">Replace uses the backup’s visits and preferences instead. It can overwrite conflicts, restore deleted visits, and remove visits missing from the backup. Changes synchronize when online and signed in. Your unfinished timer stays on this device.</p>${localStorage.getItem(RECOVERYKEY)?'<p class="input-help">Previous recovery snapshots are kept on this device. You can download the latest snapshot here.</p>':''}`,
 `<button class="btn btn-outline" onclick="exportRecovery()">Download recovery snapshot</button><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="confirmBackupReplace()">Replace…</button><button class="btn" onclick="applyBackupRestore('merge')">Safe merge · Recommended</button>`);
 document.querySelector('#modalRoot .icon-btn')?.focus();
}
function confirmBackupReplace(){
 if(!pendingBackup)return;
 if(backupPreviewState!==restoreState()){toast('Your journal changed. Review the updated preview.');showBackupPreview();return}
 modal('Confirm replacement',`<div class="notice">This replaces all ${db.visits.length} current visits and your preferences with ${pendingBackup.visits.length} backup visits. Missing visits will be deleted and conflicts overwritten, including through cloud sync. A recovery snapshot of this device will be saved first.</div><p class="small muted" style="margin-top:18px">Export your current journal before continuing.</p><label class="small"><input id="replaceConsent" type="checkbox" onchange="document.getElementById('replaceConfirm').disabled=!this.checked"/> I understand that replacement overwrites and removes existing data.</label>`,
 `<button class="btn btn-outline" onclick="exportJSON()">Export current backup</button><button class="btn btn-outline" onclick="showBackupPreview()">Back</button><button id="replaceConfirm" class="btn btn-danger" disabled onclick="applyBackupRestore('replace')">Confirm replace</button>`);
 document.getElementById('replaceConsent').focus();
}
function exportRecovery(){
 const raw=localStorage.getItem(RECOVERYKEY);if(!raw){toast('No recovery snapshot yet. One is saved before restoring.');return}
 try{const saved=JSON.parse(raw);downloadFile(JSON.stringify({...saved.db,format:'loyly-journal-v1',exportedAt:saved.savedAt},null,2),'loyly-before-restore.json','application/json')}catch(e){toast('Could not read the recovery snapshot.')}
}
function applyBackupRestore(mode){
 if(!pendingBackup||!['merge','replace'].includes(mode))return;
 if(mode==='replace'&&!document.getElementById('replaceConsent')?.checked)return;
 if(syncing){toast('Cloud sync is running. Wait for it to finish, then try again.');return}
 if(backupPreviewState!==restoreState()){toast('Your journal changed. Review the updated preview.');showBackupPreview();return}
 const oldDB=localStorage.getItem(KEY),oldMeta=localStorage.getItem(METAKEY),next=buildBackupRestore(pendingBackup,db,cloudMeta,mode);
 try{
  const previous=localStorage.getItem(RECOVERYKEY);
  if(previous)localStorage.setItem(RECOVERYKEY+'-archive-'+crypto.randomUUID(),previous);
  localStorage.setItem(RECOVERYKEY,JSON.stringify({db,meta:cloudMeta,savedAt:new Date().toISOString()}));
  localStorage.setItem(METAKEY,JSON.stringify(next.meta));
  localStorage.setItem(KEY,JSON.stringify(next.db));
 }catch(e){
  try{oldMeta===null?localStorage.removeItem(METAKEY):localStorage.setItem(METAKEY,oldMeta);oldDB===null?localStorage.removeItem(KEY):localStorage.setItem(KEY,oldDB)}catch(rollbackError){}
  toast('Restore could not be saved. Your journal has not been changed.');return;
 }
 db=next.db;cloudMeta=next.meta;lastSavedVisits=structuredClone(db.visits);lastSavedProfile=JSON.stringify(db.profile);localEditVersion++;
 pendingBackup=null;closeModal();renderPage();scheduleCloudSync();toast(mode==='merge'?'Backup merged. Existing entries kept.':'Backup replaced. Recovery snapshot saved.');
}

const WELCOME_DAY_KEY='loyly-welcome-day-v1';
// One approved image, optimized from assets/landscape-intro.PNG. The SVG viewport crops only its display.
const WELCOME_SCENE='./assets/welcome-landscape.webp';
let welcomeRun=null;
function appearance(){return normalizeAppearance(db.profile.appearance)}
function applyAppearance(){document.body.dataset.background=appearance().background;if(!appearance().dailyIntro)closeWelcome()}
function appearanceMarkup(){const a=appearance();return `<h2>Appearance</h2><h3>Welcome Experience</h3><label class="welcome-preference" for="dailyWelcome"><input type="checkbox" id="dailyWelcome" ${a.dailyIntro?'checked':''} onchange="saveAppearance('dailyIntro',this.checked)"/><span>Show welcome on launch</span></label><button class="btn btn-outline" id="previewWelcome" onclick="playWelcome(true)">${icon('play')} Preview introduction</button><p class="input-help" style="margin-top:12px">A quiet, five-second welcome. Skip at any time. Reduced-motion settings are respected.</p>`}
function saveAppearance(key,value){
 const previous=db.profile.appearance;
 db.profile.appearance={...appearance(),[key]:value};
 if(!persist()){if(previous===undefined)delete db.profile.appearance;else db.profile.appearance=previous;renderProfile();return}

}
function closeWelcome(){
 document.documentElement.classList.remove('welcome-pending');
 const run=welcomeRun;if(!run)return;
 welcomeRun=null;clearTimeout(run.timer);clearTimeout(run.loadTimer);run.cancelLoad?.(false);
 document.removeEventListener('pointerdown',run.interact,true);document.removeEventListener('keydown',run.key,true);document.removeEventListener('focusin',run.focus,true);
 document.removeEventListener('visibilitychange',run.visibility);run.motion.removeEventListener('change',run.motionChange);
 run.images.forEach(img=>{img.onload=null;img.onerror=null});
 const restore=run.element?.contains(document.activeElement);run.element?.remove();
 if(restore&&run.previousFocus?.isConnected)run.previousFocus.focus({preventScroll:true});
}
async function playWelcome(preview=false){
 closeWelcome();
 const motion=matchMedia('(prefers-reduced-motion: reduce)');
 if(motion.matches){if(preview)toast('Introduction skipped because Reduce Motion is enabled.');return}
 if(!preview){
  if(!appearance().dailyIntro||document.hidden)return;
 }
 const run={images:[],motion,preview,previousFocus:document.activeElement};welcomeRun=run;
 run.interact=()=>closeWelcome();run.key=e=>{if(e.key==='Escape'||e.key==='Tab')closeWelcome()};
 run.focus=e=>{if(run.element&&!run.element.contains(e.target))closeWelcome()};
 run.visibility=()=>{if(document.hidden)closeWelcome()};run.motionChange=e=>{if(e.matches)closeWelcome()};
 document.addEventListener('pointerdown',run.interact,true);document.addEventListener('keydown',run.key,true);document.addEventListener('focusin',run.focus,true);
 document.addEventListener('visibilitychange',run.visibility);motion.addEventListener('change',run.motionChange);
 const el=document.createElement('div');run.element=el;el.className='welcome-intro loading';el.setAttribute('role','region');el.setAttribute('aria-label','Ølo Notes welcome introduction');
 el.insertAdjacentHTML('beforeend','<div class="welcome-shade" aria-hidden="true"></div><div class="welcome-wordmark" aria-hidden="true"><strong>Ølo Notes</strong><p>Your Nordic Wellness Journal</p></div><button class="welcome-skip" type="button">Skip</button>');
 el.querySelector('button').onclick=closeWelcome;document.body.append(el);
 if(preview)el.querySelector('button').focus({preventScroll:true});
 const loaded=await Promise.race([
  new Promise(resolve=>{run.cancelLoad=resolve}),
  new Promise(resolve=>{const img=new Image();run.images.push(img);img.onload=()=>resolve(true);img.onerror=()=>resolve(false);img.src=WELCOME_SCENE}),
  new Promise(resolve=>{run.loadTimer=setTimeout(()=>resolve(false),1200)})
 ]);
 if(welcomeRun!==run)return;clearTimeout(run.loadTimer);
 if(!loaded){closeWelcome();if(preview)toast('Introduction unavailable: the landscape image could not load.');return}
 // Keep the complete approved artwork intact; show only the scene below its baked-in lettering.
 // Source coordinates exclude the phone frame, status icons and home indicator.

 scene.setAttribute('class','welcome-scene');scene.setAttribute('viewBox','96 500 832 970');scene.setAttribute('preserveAspectRatio','xMidYMid slice');scene.setAttribute('aria-hidden','true');scene.setAttribute('focusable','false');

 run.timer=setTimeout(closeWelcome,5000);
}

// Weather preferences stay on this device, separate from journal and cloud data.
const WEATHER_LOCATION_KEY='olo-weather-location-v1';
let weatherLocation=readWeatherLocation(),weatherState=null,weatherBusy=false,weatherAttempt=0,weatherResults=[],weatherSearchVersion=0;
function validWeatherLocation(x){return x&&typeof x.name==='string'&&Number.isFinite(x.latitude)&&Math.abs(x.latitude)<=90&&Number.isFinite(x.longitude)&&Math.abs(x.longitude)<=180}
function readWeatherLocation(){try{const x=JSON.parse(localStorage.getItem(WEATHER_LOCATION_KEY));return validWeatherLocation(x)?x:null}catch(e){return null}}
function weatherCondition(code,temp,day){if(code>=95)return {name:'Thunderstorms',icon:'storm'};if([71,73,75,77,85,86].includes(code))return {name:'Snow',icon:'snow'};if(code>=51&&code<=82)return {name:'Rain',icon:'rain'};if(temp<=32)return {name:'Cold',icon:'snow'};if(code===0)return {name:day?'Sunny':'Clear',icon:day?'sun':'moon'};if(code===1||code===2)return {name:'Partly cloudy',icon:'partly'};if(code===3)return {name:'Cloudy',icon:'cloud'};if(code===45||code===48)return {name:'Fog',icon:'cloud'};return {name:'Weather unavailable',icon:'cloud'}}
function weatherIcon(name){const shapes={cloud:'<path d="M6 18h12a4 4 0 0 0 .3-8 6 6 0 0 0-11.5-1A4.5 4.5 0 0 0 6 18Z"/>',rain:'<path d="M5 15h13a4 4 0 0 0 0-8 6 6 0 0 0-11-1A5 5 0 0 0 5 15ZM8 18l-1 3m6-3-1 3m6-3-1 3"/>',storm:'<path d="M5 15a5 5 0 0 1 1-10 6 6 0 0 1 11 2 4 4 0 0 1 1 8M13 11l-4 6h4l-2 5 6-8h-4Z"/>',moon:'<path d="M20 15A8 8 0 0 1 9 4a8 8 0 1 0 11 11Z"/>',partly:'<path d="M8 2v2M2 8h2M4 4l1.5 1.5M13 4l-1.5 1.5"/><path d="M7 12a4 4 0 1 1 6-5M8 20h10a4 4 0 0 0 0-8 5 5 0 0 0-9-1 4.5 4.5 0 0 0-1 9Z"/>'};return shapes[name]?`<svg viewBox="0 0 24 24" aria-hidden="true">${shapes[name]}</svg>`:icon(name)}
function renderWeather(){const button=document.getElementById('weatherControl');if(!button)return;const current=weatherState&&weatherLocation&&weatherState.location===weatherLocation.name?weatherState:null;const fresh=current&&Date.now()-current.fetchedAt<30*60000;const label=fresh?Math.round(current.temp)+'°F':weatherLocation?'—':'Weather';const detail=fresh?`${weatherLocation.name} · ${current.condition.name} · ${label}`:weatherLocation?`${weatherLocation.name} · Weather unavailable`:'Choose a city for local weather';document.getElementById('sunIcon').innerHTML=weatherIcon(fresh?current.condition.icon:'cloud');document.getElementById('weatherLabel').textContent=label;button.title=detail;button.setAttribute('aria-label',detail+'. Change weather location');}
async function weatherJSON(url){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{const response=await fetch(url,{signal:controller.signal,credentials:'omit'});if(!response.ok)throw Error('Weather request failed');return await response.json()}finally{clearTimeout(timer)}}
async function refreshWeather(force=false){if(!document.getElementById('weatherControl')||!weatherLocation||weatherBusy||(!force&&Date.now()-weatherAttempt<15*60000)){renderWeather();return}const location=weatherLocation;weatherBusy=true;weatherAttempt=Date.now();try{const params=new URLSearchParams({latitude:location.latitude,longitude:location.longitude,current:'temperature_2m,weather_code,is_day',temperature_unit:'fahrenheit',timezone:'auto'});const data=await weatherJSON('https://api.open-meteo.com/v1/forecast?'+params);const c=data.current;if(!c||!Number.isFinite(c.temperature_2m)||!Number.isInteger(c.weather_code))throw Error('Missing weather');if(weatherLocation!==location)return;weatherState={location:location.name,temp:c.temperature_2m,condition:weatherCondition(c.weather_code,c.temperature_2m,c.is_day===1),fetchedAt:Date.now()}}catch(e){if(force)toast('Weather is unavailable right now. Your city is saved; try again later.')}finally{weatherBusy=false;renderWeather();if(weatherLocation&&weatherLocation!==location)refreshWeather(true)}}
function openWeatherLocation(){weatherSearchVersion++;weatherResults=[];modal('Local weather',`<p class="small muted">Choose your city to show current conditions beside the date.</p><form onsubmit="event.preventDefault();searchWeatherCity()"><div class="field"><label for="weatherCity">City or postal code</label><input id="weatherCity" autocomplete="address-level2" placeholder="e.g. Denver, Colorado" value="${esc(weatherLocation?.name||'')}"/></div><button class="btn btn-outline" type="submit">Search cities</button></form><div id="weatherSearchResults" role="status" style="margin-top:18px"></div><p class="weather-source">Weather by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> · Locations by GeoNames. Your chosen city is saved only on this device.</p>`,`<button class="btn btn-outline" onclick="closeModal()">Close</button>${weatherLocation?'<button class="btn btn-outline" onclick="refreshWeather(true);closeModal()">Refresh</button><button class="btn btn-outline" onclick="clearWeatherLocation()">Remove city</button>':''}`)}
async function searchWeatherCity(){const input=document.getElementById('weatherCity'),target=document.getElementById('weatherSearchResults');if(!input||!target)return;const name=input.value.trim(),version=++weatherSearchVersion;if(name.length<2){target.textContent='Enter at least two characters.';return}target.textContent='Finding cities…';try{const data=await weatherJSON('https://geocoding-api.open-meteo.com/v1/search?'+new URLSearchParams({name,count:6,language:'en',format:'json'}));if(version!==weatherSearchVersion||!target.isConnected)return;weatherResults=(data.results||[]).map(x=>({name:[x.name,x.admin1,x.country].filter(Boolean).join(', '),latitude:x.latitude,longitude:x.longitude})).filter(validWeatherLocation);if(!weatherResults.length){target.textContent='No matching cities. Try a nearby city or add the country.';return}target.innerHTML=`<div class="field"><label for="weatherCityChoice">Choose location</label><select id="weatherCityChoice">${weatherResults.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join('')}</select></div><button class="btn" onclick="useWeatherCity()">Use this city</button>`}catch(e){if(version===weatherSearchVersion&&target.isConnected)target.textContent='City search is unavailable. Please try again.'}}
function useWeatherCity(){const selected=weatherResults[Number(document.getElementById('weatherCityChoice')?.value)];if(!validWeatherLocation(selected))return;weatherLocation=selected;weatherState=null;weatherAttempt=0;try{localStorage.setItem(WEATHER_LOCATION_KEY,JSON.stringify(selected))}catch(e){toast('City selected for this session; browser storage is unavailable.')}closeModal();renderWeather();refreshWeather(true)}
function clearWeatherLocation(){weatherSearchVersion++;weatherLocation=null;weatherState=null;weatherAttempt=0;try{localStorage.removeItem(WEATHER_LOCATION_KEY)}catch(e){}closeModal();renderWeather()}
setInterval(()=>{if(!document.hidden)refreshWeather()},15*60000);

navRender();nav('home');playWelcome();refreshWeather();if(cloud.session?.access_token)setTimeout(()=>syncCloud(false),700);setInterval(()=>{if(view==='session'&&sessionTab==='timer'&&draft?.current){let clock=document.getElementById('liveClock'),label=document.getElementById('currentIntervalLabel');if(clock)clock.textContent=fmtTime(currentElapsed());if(label)label.textContent=fmtM(currentElapsed())}},500);
</script>
